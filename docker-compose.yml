services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      # setup environment variables, with a fallback for local vars for development
      POSTGRES_DB: ${DB_NAME:-financial_data}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_net

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - financial_net

  # Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - financial_net
    command: >
      sh -c "ollama serve &
             sleep 10 &&
             ollama pull ${OLLAMA_MODEL:-deepseek-r1:32b} &&
             wait"

  # Main application
  financial_app:
    build: .
    depends_on:
      - postgres
      - redis
      - ollama
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      # environment variables for the app, read from .env file
      - DB_NAME=${DB_NAME:-financial_data}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENABLE_SQLITE_FALLBACK=${ENABLE_SQLITE_FALLBACK:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-r1:32b}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-120}
      - API_KEY_ALPHAVANTAGE=${API_KEY_ALPHAVANTAGE}
      - API_KEY_FINANCIALMODELINGPREP=${API_KEY_FINANCIALMODELINGPREP}
      - API_KEY_NEWS=${API_KEY_NEWS}
      - API_KEY_POLYGON=${API_KEY_POLYGON}
    ports:
      - "127.0.0.1:8501:8501"  # Streamlit dashboard
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - financial_net

volumes:
  postgres_data:
  ollama_data:

networks:
  financial_net:
    driver: bridge
