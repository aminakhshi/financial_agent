services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      # setup environment variables, with a fallback for local vars for development
      POSTGRES_DB: ${DB_NAME:-financial_data}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_net

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - financial_net

  # Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - financial_net
    command: ["serve"]

  # Main application
  financial_app:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      - postgres
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      # environment variables for the app, read from .env file
      - DB_NAME=${DB_NAME:-financial_data}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENABLE_SQLITE_FALLBACK=${ENABLE_SQLITE_FALLBACK:-false}
      - DISABLE_CREWAI=${DISABLE_CREWAI:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-r1:32b}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-120}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-testapikey}
      - STREAMLIT_SERVER_ADDRESS=${STREAMLIT_SERVER_ADDRESS:-0.0.0.0}
      - STREAMLIT_SERVER_PORT=${STREAMLIT_SERVER_PORT:-8501}
      - STARTUP_DAILY_BACKFILL_ENABLED=${STARTUP_DAILY_BACKFILL_ENABLED:-false}
      - STARTUP_DAILY_BACKFILL_UNIVERSE=${STARTUP_DAILY_BACKFILL_UNIVERSE:-sp500}
      - STARTUP_DAILY_BACKFILL_START=${STARTUP_DAILY_BACKFILL_START:-1991-01-01}
      - STARTUP_DAILY_BACKFILL_END=${STARTUP_DAILY_BACKFILL_END:-}
      - STARTUP_DAILY_BACKFILL_BATCH_SIZE=${STARTUP_DAILY_BACKFILL_BATCH_SIZE:-25}
      - STARTUP_HOURLY_BACKFILL_ENABLED=${STARTUP_HOURLY_BACKFILL_ENABLED:-false}
      - STARTUP_HOURLY_BACKFILL_UNIVERSE=${STARTUP_HOURLY_BACKFILL_UNIVERSE:-sp500}
      - STARTUP_HOURLY_BACKFILL_PERIOD=${STARTUP_HOURLY_BACKFILL_PERIOD:-6mo}
      - STARTUP_HOURLY_BACKFILL_END=${STARTUP_HOURLY_BACKFILL_END:-}
      - STARTUP_HOURLY_BACKFILL_BATCH_SIZE=${STARTUP_HOURLY_BACKFILL_BATCH_SIZE:-25}
      - ENABLE_DAILY_MARKET_UPDATE=${ENABLE_DAILY_MARKET_UPDATE:-false}
      - DAILY_MARKET_UPDATE_UNIVERSE=${DAILY_MARKET_UPDATE_UNIVERSE:-sp500}
      - DAILY_MARKET_UPDATE_PERIOD=${DAILY_MARKET_UPDATE_PERIOD:-7d}
      - DAILY_MARKET_UPDATE_TIME=${DAILY_MARKET_UPDATE_TIME:-18:30}
      - DAILY_MARKET_UPDATE_BATCH_SIZE=${DAILY_MARKET_UPDATE_BATCH_SIZE:-25}
      - HOME=/tmp
      - XDG_DATA_HOME=/tmp/.local/share
      - API_KEY_ALPHAVANTAGE=${API_KEY_ALPHAVANTAGE}
      - API_KEY_FINANCIALMODELINGPREP=${API_KEY_FINANCIALMODELINGPREP}
      - API_KEY_NEWS=${API_KEY_NEWS}
      - API_KEY_POLYGON=${API_KEY_POLYGON}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8501}:8501"  # Streamlit dashboard
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - financial_net

  financial_api:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      - postgres
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-financial_data}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENABLE_SQLITE_FALLBACK=${ENABLE_SQLITE_FALLBACK:-false}
      - DISABLE_CREWAI=${DISABLE_CREWAI:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-r1:32b}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-120}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-testapikey}
      - STARTUP_DAILY_BACKFILL_ENABLED=${STARTUP_DAILY_BACKFILL_ENABLED:-false}
      - STARTUP_DAILY_BACKFILL_UNIVERSE=${STARTUP_DAILY_BACKFILL_UNIVERSE:-sp500}
      - STARTUP_DAILY_BACKFILL_START=${STARTUP_DAILY_BACKFILL_START:-1991-01-01}
      - STARTUP_DAILY_BACKFILL_END=${STARTUP_DAILY_BACKFILL_END:-}
      - STARTUP_DAILY_BACKFILL_BATCH_SIZE=${STARTUP_DAILY_BACKFILL_BATCH_SIZE:-25}
      - STARTUP_HOURLY_BACKFILL_ENABLED=${STARTUP_HOURLY_BACKFILL_ENABLED:-false}
      - STARTUP_HOURLY_BACKFILL_UNIVERSE=${STARTUP_HOURLY_BACKFILL_UNIVERSE:-sp500}
      - STARTUP_HOURLY_BACKFILL_PERIOD=${STARTUP_HOURLY_BACKFILL_PERIOD:-6mo}
      - STARTUP_HOURLY_BACKFILL_END=${STARTUP_HOURLY_BACKFILL_END:-}
      - STARTUP_HOURLY_BACKFILL_BATCH_SIZE=${STARTUP_HOURLY_BACKFILL_BATCH_SIZE:-25}
      - ENABLE_DAILY_MARKET_UPDATE=${ENABLE_DAILY_MARKET_UPDATE:-false}
      - DAILY_MARKET_UPDATE_UNIVERSE=${DAILY_MARKET_UPDATE_UNIVERSE:-sp500}
      - DAILY_MARKET_UPDATE_PERIOD=${DAILY_MARKET_UPDATE_PERIOD:-7d}
      - DAILY_MARKET_UPDATE_TIME=${DAILY_MARKET_UPDATE_TIME:-18:30}
      - DAILY_MARKET_UPDATE_BATCH_SIZE=${DAILY_MARKET_UPDATE_BATCH_SIZE:-25}
      - HOME=/tmp
      - XDG_DATA_HOME=/tmp/.local/share
      - API_KEY_ALPHAVANTAGE=${API_KEY_ALPHAVANTAGE}
      - API_KEY_FINANCIALMODELINGPREP=${API_KEY_FINANCIALMODELINGPREP}
      - API_KEY_NEWS=${API_KEY_NEWS}
      - API_KEY_POLYGON=${API_KEY_POLYGON}
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - financial_net

volumes:
  postgres_data:
  ollama_data:

networks:
  financial_net:
    driver: bridge
